<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6DB86B"/>
      <stop offset="100%" style="stop-color:#4A8F48"/>
    </linearGradient>
  </defs>
  <!-- 圆角矩形背景 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 打开的笔记本 -->
  <g transform="translate(256,200)" fill="none" stroke="white" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- 书脊 -->
    <line x1="0" y1="-80" x2="0" y2="80"/>
    <!-- 左页 -->
    <path d="M0,-80 C-80,-85 -120,-50 -120,0 C-120,50 -80,85 0,80" fill="rgba(255,255,255,0.15)"/>
    <!-- 右页 -->
    <path d="M0,-80 C80,-85 120,-50 120,0 C120,50 80,85 0,80" fill="rgba(255,255,255,0.15)"/>
    <!-- 左页文字线 -->
    <line x1="-85" y1="-35" x2="-20" y2="-40" stroke="white" stroke-width="6" opacity="0.6"/>
    <line x1="-85" y1="-10" x2="-20" y2="-15" stroke="white" stroke-width="6" opacity="0.6"/>
    <line x1="-85" y1="15" x2="-20" y2="10" stroke="white" stroke-width="6" opacity="0.6"/>
    <!-- 右页文字线 -->
    <line x1="20" y1="-40" x2="85" y2="-35" stroke="white" stroke-width="6" opacity="0.6"/>
    <line x1="20" y1="-15" x2="85" y2="-10" stroke="white" stroke-width="6" opacity="0.6"/>
    <line x1="20" y1="10" x2="85" y2="15" stroke="white" stroke-width="6" opacity="0.6"/>
  </g>
  <!-- 爱心 -->
  <g transform="translate(256,368)">
    <path d="M0,0 C-10,-30 -45,-50 -70,-35 C-95,-20 -85,15 -60,35 L0,70 L60,35 C85,15 95,-20 70,-35 C45,-50 10,-30 0,0Z"
          fill="white" opacity="0.9"/>
  </g>
</svg>
