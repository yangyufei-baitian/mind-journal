# Render Blueprint — 一键部署后端
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mind-journal-api
    env: python
    region: singapore  # 亚洲访问快
    plan: free
    buildCommand: pip install -r requirements.txt && mkdir -p static && cp -r ../frontend/. static/ && echo "=== Static files ===" && ls static/
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
